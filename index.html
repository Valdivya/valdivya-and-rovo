<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Valdivya builds thoughtful web experiences with Rovo Dev and Atlassian tools.">
  <meta name="theme-color" content="#192F34">
  <title>Valdivya × Rovo Dev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    .valdivya-app {
      --olive: #CDD77A;
      --cream: #FAF6E9;
      --cream-2: #F1EBD5;
      --dark: #192F34;
      --ink: #2A2620;
      --ink-soft: #5C5847;
      --line: rgba(25, 47, 52, 0.16);
      margin: 0;
      min-width: 320px;
      background: var(--cream);
      color: var(--ink);
      font-family: "Poppins", sans-serif;
      font-size: 16px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    .valdivya-app *,
    .valdivya-app *::before,
    .valdivya-app *::after { box-sizing: border-box; }

    .valdivya-app h1,
    .valdivya-app h2,
    .valdivya-app h3,
    .valdivya-app p { margin-top: 0; }

    .valdivya-app h1,
    .valdivya-app h2,
    .valdivya-app h3 {
      color: var(--dark);
      font-family: "EB Garamond", serif;
      line-height: 1.05;
    }

    .valdivya-app a { color: inherit; }
    .valdivya-app button { font: inherit; }

    .valdivya-app .skip-link {
      position: fixed;
      z-index: 100;
      top: 0.75rem;
      left: 0.75rem;
      padding: 0.65rem 1rem;
      transform: translateY(-160%);
      border-radius: 999px;
      background: var(--olive);
      color: var(--dark);
      font-weight: 600;
      text-decoration: none;
    }

    .valdivya-app .skip-link:focus { transform: translateY(0); }

    .valdivya-app .shell {
      width: min(1160px, calc(100% - 3rem));
      margin-inline: auto;
    }

    .valdivya-app .site-header {
      position: absolute;
      z-index: 20;
      top: 0;
      right: 0;
      left: 0;
      border-bottom: 1px solid rgba(250, 246, 233, 0.14);
      color: var(--cream);
    }

    .valdivya-app .nav {
      display: flex;
      min-height: 84px;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
    }

    .valdivya-app .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      font-family: "EB Garamond", serif;
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-decoration: none;
    }

    .valdivya-app .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 1px solid var(--olive);
      border-radius: 50%;
      color: var(--olive);
      font-size: 1rem;
    }

    .valdivya-app .nav-links {
      display: flex;
      align-items: center;
      gap: 2rem;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .valdivya-app .nav-links a {
      position: relative;
      color: var(--cream);
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .valdivya-app .nav-links a:not(.nav-cta)::after {
      position: absolute;
      right: 0;
      bottom: -0.4rem;
      left: 0;
      height: 2px;
      transform: scaleX(0);
      background: var(--olive);
      content: "";
      transition: transform 180ms ease;
    }

    .valdivya-app .nav-links a:hover::after,
    .valdivya-app .nav-links a:focus-visible::after { transform: scaleX(1); }

    .valdivya-app .nav-links .nav-cta {
      padding: 0.65rem 1.15rem;
      border: 1px solid var(--olive);
      border-radius: 999px;
      color: var(--olive);
    }

    .valdivya-app .menu-toggle {
      display: none;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(250, 246, 233, 0.4);
      border-radius: 50%;
      background: transparent;
      color: var(--cream);
      cursor: pointer;
    }

    .valdivya-app .menu-toggle span,
    .valdivya-app .menu-toggle::before,
    .valdivya-app .menu-toggle::after {
      display: block;
      width: 18px;
      height: 1px;
      margin: 5px auto;
      background: currentColor;
      content: "";
      transition: transform 180ms ease, opacity 180ms ease;
    }

    .valdivya-app .menu-toggle[aria-expanded="true"] span { opacity: 0; }
    .valdivya-app .menu-toggle[aria-expanded="true"]::before { transform: translateY(6px) rotate(45deg); }
    .valdivya-app .menu-toggle[aria-expanded="true"]::after { transform: translateY(-6px) rotate(-45deg); }

    .valdivya-app .hero {
      position: relative;
      overflow: hidden;
      min-height: 720px;
      padding: 10.5rem 0 7rem;
      background: var(--dark);
      color: var(--cream);
    }

    .valdivya-app .hero::before {
      position: absolute;
      top: -22rem;
      right: -14rem;
      width: 48rem;
      height: 48rem;
      border: 1px solid rgba(205, 215, 122, 0.18);
      border-radius: 50%;
      box-shadow: 0 0 0 5rem rgba(205, 215, 122, 0.035), 0 0 0 10rem rgba(205, 215, 122, 0.025);
      content: "";
    }

    .valdivya-app .hero-grid {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(300px, 0.8fr);
      align-items: end;
      gap: clamp(3rem, 8vw, 8rem);
    }

    .valdivya-app .eyebrow {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 1.5rem;
      color: var(--ink-soft);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .valdivya-app .eyebrow::before {
      width: 34px;
      height: 2px;
      background: var(--olive);
      content: "";
    }

    .valdivya-app .hero .eyebrow { color: var(--olive); }

    .valdivya-app .hero h1 {
      max-width: 780px;
      margin-bottom: 1.7rem;
      color: var(--cream);
      font-size: clamp(3.8rem, 8vw, 7.4rem);
      font-weight: 400;
      letter-spacing: -0.045em;
    }

    .valdivya-app .hero h1 em {
      color: var(--olive);
      font-weight: 600;
    }

    .valdivya-app .hero-copy > p:not(.eyebrow) {
      max-width: 620px;
      margin-bottom: 2rem;
      color: rgba(250, 246, 233, 0.72);
      font-size: 1.05rem;
    }

    .valdivya-app .actions { display: flex; flex-wrap: wrap; gap: 0.8rem; }

    .valdivya-app .button {
      display: inline-flex;
      min-height: 50px;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      padding: 0.8rem 1.45rem;
      border: 1px solid transparent;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-decoration: none;
      transition: transform 180ms ease, background-color 180ms ease;
    }

    .valdivya-app .button:hover { transform: translateY(-2px); }
    .valdivya-app .button-primary { background: var(--olive); color: var(--dark); }
    .valdivya-app .button-secondary { border-color: rgba(250, 246, 233, 0.4); color: var(--cream); }
    .valdivya-app .button-secondary:hover { background: rgba(250, 246, 233, 0.08); }

    .valdivya-app .hero-note {
      padding: 2rem 0 0 2rem;
      border-left: 1px solid var(--olive);
    }

    .valdivya-app .hero-note .note-number {
      display: block;
      margin-bottom: 0.7rem;
      color: var(--olive);
      font-family: "EB Garamond", serif;
      font-size: 3rem;
      line-height: 1;
    }

    .valdivya-app .hero-note p { margin: 0; color: rgba(250, 246, 233, 0.7); font-size: 0.9rem; }

    .valdivya-app .section { padding: clamp(5rem, 10vw, 8.5rem) 0; }

    .valdivya-app .section-heading {
      display: grid;
      grid-template-columns: 0.85fr 1.15fr;
      align-items: end;
      gap: 3rem;
      margin-bottom: 4.5rem;
    }

    .valdivya-app .section-heading h2 {
      max-width: 650px;
      margin-bottom: 0;
      font-size: clamp(2.8rem, 5vw, 4.7rem);
      font-weight: 400;
      letter-spacing: -0.035em;
    }

    .valdivya-app .section-heading > p { max-width: 560px; margin: 0; color: var(--ink-soft); }

    .valdivya-app .capabilities { background: var(--cream-2); }

    .valdivya-app .card-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      border: 1px solid var(--line);
      background: var(--line);
    }

    .valdivya-app .card {
      min-height: 330px;
      padding: 2.2rem;
      background: var(--cream-2);
      transition: background-color 180ms ease;
    }

    .valdivya-app .card:hover { background: var(--cream); }

    .valdivya-app .card-icon {
      display: grid;
      width: 48px;
      height: 48px;
      margin-bottom: 4.5rem;
      place-items: center;
      border: 1px solid var(--olive);
      border-radius: 50%;
      color: var(--dark);
      font-family: "EB Garamond", serif;
      font-size: 1.15rem;
      font-weight: 700;
    }

    .valdivya-app .card h3 { margin-bottom: 0.8rem; font-size: 1.7rem; font-weight: 600; }
    .valdivya-app .card p { margin-bottom: 0; color: var(--ink-soft); font-size: 0.9rem; }

    .valdivya-app .workflow-grid {
      display: grid;
      grid-template-columns: 0.75fr 1.25fr;
      gap: clamp(3rem, 8vw, 7rem);
    }

    .valdivya-app .workflow-intro { position: sticky; top: 3rem; align-self: start; }

    .valdivya-app .workflow-intro h2 {
      margin-bottom: 1.5rem;
      font-size: clamp(3rem, 5vw, 5rem);
      font-weight: 400;
      letter-spacing: -0.035em;
    }

    .valdivya-app .workflow-intro > p:not(.eyebrow) { color: var(--ink-soft); }

    .valdivya-app .steps { border-top: 1px solid var(--dark); }

    .valdivya-app .step {
      display: grid;
      grid-template-columns: 70px 1fr;
      gap: 1.5rem;
      padding: 2.1rem 0;
      border-bottom: 1px solid var(--line);
    }

    .valdivya-app .step-number { color: var(--ink-soft); font-size: 0.78rem; font-weight: 600; }
    .valdivya-app .step h3 { margin-bottom: 0.55rem; font-size: 1.8rem; font-weight: 600; }
    .valdivya-app .step p { max-width: 600px; margin: 0; color: var(--ink-soft); font-size: 0.92rem; }

    .valdivya-app .architecture {
      overflow: hidden;
      padding: clamp(5rem, 9vw, 7.5rem) 0;
      background: var(--dark);
      color: var(--cream);
    }

    .valdivya-app .architecture h2 { color: var(--cream); }
    .valdivya-app .architecture .section-heading > p { color: rgba(250, 246, 233, 0.68); }
    .valdivya-app .architecture .eyebrow { color: var(--olive); }

    .valdivya-app .architecture-flow {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
    }

    .valdivya-app .flow-item {
      position: relative;
      min-height: 190px;
      padding: 1.5rem;
      border: 1px solid rgba(250, 246, 233, 0.16);
    }

    .valdivya-app .flow-item:not(:last-child)::after {
      position: absolute;
      z-index: 2;
      top: 50%;
      right: -1.55rem;
      display: grid;
      width: 2.1rem;
      height: 2.1rem;
      place-items: center;
      border-radius: 50%;
      background: var(--olive);
      color: var(--dark);
      content: "→";
      font-size: 0.9rem;
      transform: translateY(-50%);
    }

    .valdivya-app .flow-item small { color: var(--olive); font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; }
    .valdivya-app .flow-item h3 { margin: 2.8rem 0 0.45rem; color: var(--cream); font-size: 1.45rem; }
    .valdivya-app .flow-item p { margin: 0; color: rgba(250, 246, 233, 0.6); font-size: 0.78rem; }

    .valdivya-app .cta { text-align: center; }

    .valdivya-app .cta-inner {
      padding: clamp(3.5rem, 8vw, 6.5rem) 2rem;
      border-top: 1px solid var(--dark);
      border-bottom: 1px solid var(--dark);
    }

    .valdivya-app .cta h2 {
      max-width: 850px;
      margin: 0 auto 1.5rem;
      font-size: clamp(3.1rem, 7vw, 6.5rem);
      font-weight: 400;
      letter-spacing: -0.045em;
    }

    .valdivya-app .cta p { max-width: 630px; margin: 0 auto 2rem; color: var(--ink-soft); }
    .valdivya-app .cta .actions { justify-content: center; }
    .valdivya-app .cta .button-secondary { border-color: var(--dark); color: var(--dark); }
    .valdivya-app .cta .button-secondary:hover { background: var(--cream-2); }

    .valdivya-app .site-footer { padding: 4rem 0 2rem; background: var(--dark); color: var(--cream); }

    .valdivya-app .footer-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: start;
      gap: 3rem;
      padding-bottom: 4rem;
    }

    .valdivya-app .footer-grid h2 { max-width: 570px; margin: 0; color: var(--cream); font-size: clamp(2.3rem, 4vw, 4rem); font-weight: 400; }
    .valdivya-app .footer-links { display: grid; gap: 0.7rem; text-align: right; }
    .valdivya-app .footer-links a { color: var(--cream); font-size: 0.85rem; text-decoration-color: var(--olive); text-underline-offset: 0.3rem; }

    .valdivya-app .footer-bottom {
      display: flex;
      justify-content: space-between;
      gap: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(250, 246, 233, 0.14);
      color: rgba(250, 246, 233, 0.5);
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .valdivya-app :focus-visible { outline: 3px solid var(--olive); outline-offset: 4px; }

    @media (max-width: 850px) {
      .valdivya-app .menu-toggle { display: block; }
      .valdivya-app .nav-links {
        position: absolute;
        top: 84px;
        right: 0;
        left: 0;
        display: none;
        align-items: stretch;
        gap: 0;
        padding: 0.8rem 1.5rem 1.5rem;
        background: var(--dark);
      }
      .valdivya-app .nav-links.is-open { display: grid; }
      .valdivya-app .nav-links a { display: block; padding: 0.85rem 0; }
      .valdivya-app .nav-links .nav-cta { margin-top: 0.5rem; text-align: center; }
      .valdivya-app .hero-grid,
      .valdivya-app .section-heading,
      .valdivya-app .workflow-grid { grid-template-columns: 1fr; }
      .valdivya-app .hero { min-height: auto; }
      .valdivya-app .hero-note { max-width: 450px; }
      .valdivya-app .card-grid { grid-template-columns: 1fr 1fr; }
      .valdivya-app .workflow-intro { position: static; }
      .valdivya-app .architecture-flow { grid-template-columns: 1fr 1fr; }
      .valdivya-app .flow-item:nth-child(2)::after { display: none; }
    }

    @media (max-width: 560px) {
      .valdivya-app .shell { width: min(100% - 2rem, 1160px); }
      .valdivya-app .hero { padding-top: 8.5rem; }
      .valdivya-app .hero h1 { font-size: clamp(3.2rem, 16vw, 4.5rem); }
      .valdivya-app .hero-note { padding-left: 1.25rem; }
      .valdivya-app .section-heading { margin-bottom: 3rem; gap: 1.5rem; }
      .valdivya-app .card-grid,
      .valdivya-app .architecture-flow,
      .valdivya-app .footer-grid { grid-template-columns: 1fr; }
      .valdivya-app .card { min-height: 290px; }
      .valdivya-app .card-icon { margin-bottom: 3.5rem; }
      .valdivya-app .flow-item::after { display: none !important; }
      .valdivya-app .footer-links { text-align: left; }
      .valdivya-app .footer-bottom { flex-direction: column; gap: 0.4rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .valdivya-app *,
      .valdivya-app *::before,
      .valdivya-app *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body class="valdivya-app">
  <!-- BODY_CONTENT -->
</body>
</html>
